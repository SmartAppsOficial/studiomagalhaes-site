<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c1a36">
  <title>Site modelo · Studio Magalhães</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icones/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Site modelo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="assets/fontes/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/modelo.css">
  <!-- Porta de entrada (só na versão publicada): pede o login Google da conta do Studio -->
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/acesso.js"></script>
</head>
<body data-disp="livre">

  <!-- O site do cliente (montado pelo modelo.js) -->
  <main class="palco" id="palco">
    <div class="moldura" id="moldura">
      <div class="aparelho" id="aparelho">
        <div class="rolagem" id="rolagem"><div class="site" id="site"></div></div>
        <div id="camadas"></div>
      </div>
    </div>
  </main>

  <!-- Controles do Studio Magalhães (somem no modo apresentação) -->
  <button type="button" class="sm-fab" aria-label="Abrir o painel de edição" aria-expanded="false" aria-controls="painel">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 3.5l2 2-8.8 8.8-2.5.5.5-2.5z"/><path d="M8.7 15.3c-2.2-.3-4.2 1.2-4.2 3.5 0 .9-.5 1.5-1 1.7 3.5 1 7.6-.4 7.2-3.6"/></svg>
  </button>
  <div class="sm-barra" role="toolbar" aria-label="Visualização">
    <button type="button" class="so-grande" data-disp="livre" title="Tela inteira do aparelho" aria-label="Computador"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/></svg></button>
    <button type="button" class="so-grande" data-disp="tablet" title="Ver como tablet" aria-label="Tablet"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    <button type="button" class="so-grande" data-disp="celular" title="Ver como celular" aria-label="Celular"><svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg></button>
    <span class="sep so-grande"></span>
    <button type="button" data-tela title="Tela cheia" aria-label="Tela cheia"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" data-apresentar title="Modo apresentação (esconde os controles)" aria-label="Modo apresentação"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>
  </div>
  <div class="sm-dica" hidden>Toque aqui para mudar ramo, cores, estilo e fonte na frente do cliente.</div>
  <button type="button" class="sm-sair" aria-label="Sair do modo apresentação" title="Sair do modo apresentação"></button>
  <aside class="sm-painel" id="painel" aria-label="Painel de edição"></aside>

  <script src="assets/js/icones.js"></script>
  <script src="assets/js/ramos.js"></script>
  <script src="assets/js/modelo.js"></script>
</body>
</html>
